name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Types, lint, unit tests and fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Fuzz 5,000 more random sheets against the reference evaluator
        run: npm run fuzz -- --from 1001 --seeds 5000
      - run: npm run build

  browsers:
    name: End to end, on three browser engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
